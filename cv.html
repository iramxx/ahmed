<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum Vitae | Ahmed Maghri</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="assets/style.css" />
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            padding: 0;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cv-viewer-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #0f172a;
        }

        .cv-frame-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .cv-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            body {
                height: auto;
                overflow: auto;
            }

            .cv-header-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .cv-tabs {
                flex-direction: column;
            }

            .cv-frame-container {
                min-height: 80vh;
            }
        }
    </style>
</head>

<body>
    <nav class="glass-nav">
        <a href="index.html" class="nav-logo">
            <img src="assets/hero.jpg" alt="Ahmed Maghri" class="nav-logo-img">
            Ahmed Maghri
        </a>

        <button class="mobile-menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links">
            <a href="projects.html">Projects</a>
            <a href="talks.html">Talks</a>
            <a href="mathsoc.html" class="nav-link-gold">Math Society</a>
            <a href="about.html">About</a>
            <a href="cv.html" class="active">CV</a>
        </div>
    </nav>

    <script>
        document.querySelector('.mobile-menu-toggle').addEventListener('click', function () {
            this.classList.toggle('active');
            document.querySelector('.nav-links').classList.toggle('active');
        });
    </script>

    <main>
        <div class="cv-viewer-wrapper">
            <div class="cv-header-controls">
                <div class="cv-tabs">
                    <button id="tab-industry" class="cv-tab-btn active" onclick="switchCV('industry')">
                        💼 Industry &amp; SWE CV
                    </button>
                    <button id="tab-academic" class="cv-tab-btn" onclick="switchCV('academic')">
                        🎓 Academic &amp; Research CV
                    </button>
                </div>
                <div class="cv-actions">
                    <a id="cv-download-btn" href="assets/Ahmed_Maghri_CV_Industry.pdf" class="btn btn-primary" download="Ahmed_Maghri_CV_Industry.pdf">
                        ⬇ Download PDF
                    </a>
                    <a id="cv-open-btn" href="assets/Ahmed_Maghri_CV_Industry.pdf" target="_blank" class="btn btn-secondary">
                        ↗ Open in New Tab
                    </a>
                </div>
            </div>

            <div class="cv-frame-container">
                <iframe id="cv-embed" src="assets/Ahmed_Maghri_CV_Industry.pdf#toolbar=1" type="application/pdf"></iframe>
            </div>
        </div>
    </main>

    <script>
        const cvData = {
            industry: {
                file: 'assets/Ahmed_Maghri_CV_Industry.pdf',
                name: 'Ahmed_Maghri_CV_Industry.pdf'
            },
            academic: {
                file: 'assets/Ahmed_Maghri_CV_Academic.pdf',
                name: 'Ahmed_Maghri_CV_Academic.pdf'
            }
        };

        function switchCV(type) {
            const data = cvData[type];
            if (!data) return;

            const embed = document.getElementById('cv-embed');
            embed.src = data.file + '#toolbar=1';

            const downloadBtn = document.getElementById('cv-download-btn');
            downloadBtn.href = data.file;
            downloadBtn.setAttribute('download', data.name);

            const openBtn = document.getElementById('cv-open-btn');
            openBtn.href = data.file;

            document.getElementById('tab-industry').classList.toggle('active', type === 'industry');
            document.getElementById('tab-academic').classList.toggle('active', type === 'academic');
        }
    </script>
</body>

</html>
